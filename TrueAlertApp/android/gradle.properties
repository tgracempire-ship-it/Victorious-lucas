# Project-wide Gradle settings.
sdk.dir=C:\\Users\\ACER\\AppData\\Local\\Android\\Sdk

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Djavax.net.ssl.trustStoreType=Windows-ROOT -Dcom.sun.net.ssl.checkRevocation=false

# AndroidX package structure
android.useAndroidX=true
android.enableJetifier=true

# React Native configurations
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
newArchEnabled=false
hermesEnabled=true
